<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postaw na milion — Finał (Prowadzący)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0b1220;
    color: #f1f1f1;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { text-align: center; color: #d4af37; font-size: 1.5em; margin-bottom: 10px; }
  .info-bar {
    display: flex; justify-content: center; gap: 20px;
    margin-bottom: 25px; font-size: 1em; color: #ccc;
  }
  .info-bar span { background: #142238; padding: 6px 14px; border-radius: 20px; }
  .warning-box {
    max-width: 500px; margin: 40px auto; text-align: center;
    background: #2a1a1a; border: 2px solid #c0392b; border-radius: 10px; padding: 24px;
    color: #e57373;
  }
  .main-area { max-width: 700px; margin: 0 auto; }
  .question-box { background: #142238; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .category-tag {
    display: inline-block; background: #d4af37; color: #0b1220;
    font-weight: bold; padding: 6px 16px; border-radius: 20px; margin-bottom: 15px;
  }
  .question-text { font-size: 1.2em; margin-bottom: 15px; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .answer-chip { background: #1c3050; border: 2px solid #444; border-radius: 8px; padding: 14px 8px; text-align: left; }
  .answer-chip .letter { font-weight: bold; color: #d4af37; margin-right: 6px; }
  .answer-chip.correct { background: #2e7d32; border-color: #2e7d32; }
  .nav-buttons { display: flex; gap: 10px; margin-top: 15px; }
  .nav-buttons button, #revealMediaBtn {
    background: #1c3050; border: 2px solid #d4af37; color: #f1f1f1;
    padding: 14px 10px; font-size: 1em; border-radius: 8px; cursor: pointer; flex: 1;
  }
  .nav-buttons button:hover, #revealMediaBtn:hover { background: #24406b; }
  .nav-buttons button:disabled { opacity: 0.35; cursor: not-allowed; }
  #revealMediaBtn { width: 100%; margin-top: 10px; display: none; }

  .players-section { margin-top: 30px; }
  .players-section h2 { color: #d4af37; font-size: 1.2em; margin-bottom: 12px; }
  .player-row {
    display: flex; align-items: center; gap: 10px;
    background: #142238; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .player-name { font-weight: bold; flex: 1; min-width: 120px; }
  .player-score { color: #d4af37; font-weight: bold; min-width: 70px; text-align: center; }
  .player-buttons { display: flex; gap: 6px; }
  .player-buttons button {
    background: #1c3050; border: 2px solid #d4af37; color: #f1f1f1;
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.95em;
  }
  .player-buttons button:hover { background: #2e7d32; border-color: #2e7d32; }

  .end-final-btn {
    max-width: 700px; margin: 30px auto 0; display: block; width: 100%;
    background: transparent; border: 2px solid #c0392b; color: #e57373;
    padding: 14px; border-radius: 8px; cursor: pointer; font-size: 1em;
  }
  .status { text-align: center; color: #4caf50; font-size: 0.85em; margin-top: 20px; }
</style>
</head>
<body>

<h1>Finał — Panel Prowadzącego</h1>
<div class="info-bar">
  <span id="posLabel">- / -</span>
  <span id="diffLabel">-</span>
</div>

<div id="noQuestionsMsg" class="warning-box" style="display:none;">
  Brak pytań oznaczonych jako wykorzystane.<br>
  Dopisz <code>x: true</code> przy wybranych pytaniach w <code>dane.js</code>.
</div>

<div id="mainArea" class="main-area" style="display:none;">
  <div class="question-box">
    <div class="category-tag" id="qCategory"></div>
    <div class="question-text" id="qText"></div>
    <div id="qMedia" style="margin-bottom:15px;"></div>
    <div class="answers" id="qAnswers"></div>
    <button id="revealMediaBtn" onclick="revealMedia()">Odkryj zdjecie</button>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn" onclick="prevQuestion()">Poprzednie</button>
    <button id="showBtn" onclick="toggleShowQuestion()">Pokaz pytanie graczowi</button>
    <button id="nextBtn" onclick="nextQuestion()">Nastepne</button>
  </div>

  <div class="players-section">
    <h2>Zawodnicy</h2>
    <div id="zawodnicyList"></div>
  </div>

  <button class="end-final-btn" onclick="endFinal()">Zakoncz final i zeruj punkty</button>
</div>

<div class="status" id="status">Laczenie z baza danych...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="dane.js?v=3"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCI_URtq3UQA5oEvqMaHrAnG9YID5zTTSw",
  authDomain: "postaw-na-milion-30154.firebaseapp.com",
  databaseURL: "https://postaw-na-milion-30154-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "postaw-na-milion-30154",
  storageBucket: "postaw-na-milion-30154.firebasestorage.app",
  messagingSenderId: "892861421426",
  appId: "1:892861421426:web:16e947880cbfad71f92feb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
document.getElementById('status').textContent = 'Polaczono z baza danych';

const zawodnicyList = (typeof zawodnicy !== 'undefined') ? zawodnicy : [];

const MEDIA_CANDIDATES = [
  { ext: 'jpg', type: 'image' },
  { ext: 'jpeg', type: 'image' },
  { ext: 'png', type: 'image' },
  { ext: 'webp', type: 'image' },
  { ext: 'gif', type: 'image' },
  { ext: 'mp4', type: 'video' },
  { ext: 'webm', type: 'video' }
];
const mediaCache = {};

function resolveMedia(baseName) {
  if (mediaCache[baseName]) return Promise.resolve(mediaCache[baseName]);
  let i = 0;
  function tryNext() {
    if (i >= MEDIA_CANDIDATES.length) return Promise.resolve(null);
    const c = MEDIA_CANDIDATES[i];
    i++;
    const url = 'media/' + baseName + '.' + c.ext;
    return fetch(url, { method: 'HEAD' }).then(res => {
      if (res.ok) {
        const result = { url: url, type: c.type };
        mediaCache[baseName] = result;
        return result;
      }
      return tryNext();
    }).catch(function() { return tryNext(); });
  }
  return tryNext();
}

const difficultyNames = { latwe: 'Latwe', srednie: 'Srednie', trudne: 'Trudne', bardzo_trudne: 'Bardzo trudne' };
const diffOrder = ['latwe', 'srednie', 'trudne', 'bardzo_trudne'];

const finalQuestions = [];
diffOrder.forEach(function(diff) {
  Object.keys(gameData).forEach(function(zestaw) {
    (gameData[zestaw][diff] || []).forEach(function(q) {
      if (q.x) {
        finalQuestions.push(Object.assign({}, q, { difficulty: diff, zestaw: zestaw }));
      }
    });
  });
});

let state = null;

db.ref('final').on('value', function(snap) {
  state = snap.val();
  if (!state) { initFinal(); return; }
  render();
});

function initFinal() {
  const scores = {};
  zawodnicyList.forEach(function(_, i) { scores[i] = 0; });
  db.ref('final').set({ currentIndex: 0, showQuestion: false, mediaRevealed: false, scores: scores });
}

function render() {
  const total = finalQuestions.length;

  if (total === 0) {
    document.getElementById('noQuestionsMsg').style.display = 'block';
    document.getElementById('mainArea').style.display = 'none';
    return;
  }
  document.getElementById('noQuestionsMsg').style.display = 'none';
  document.getElementById('mainArea').style.display = 'block';

  const idx = Math.min(state.currentIndex, total - 1);
  const q = finalQuestions[idx];

  document.getElementById('posLabel').textContent = (idx + 1) + ' / ' + total;
  document.getElementById('diffLabel').textContent = difficultyNames[q.difficulty];

  document.getElementById('qCategory').textContent = q.kategoria;
  document.getElementById('qText').textContent = q.pytanie;

  const revealBtn = document.getElementById('revealMediaBtn');
  revealBtn.style.display = (q.mediaOdkryte && !state.mediaRevealed) ? 'block' : 'none';

  const mediaToShow = (state.mediaRevealed && q.mediaOdkryte) ? q.mediaOdkryte : q.media;
  const qMediaDiv = document.getElementById('qMedia');
  qMediaDiv.innerHTML = '';
  if (mediaToShow) {
    resolveMedia(mediaToShow).then(function(result) {
      if (!result) return;
      if (result.type === 'video') {
        qMediaDiv.innerHTML = '<video src="' + result.url + '" controls autoplay loop style="max-width:100%; border-radius:8px;"></video>';
      } else {
        qMediaDiv.innerHTML = '<img src="' + result.url + '" style="max-width:100%; border-radius:8px;">';
      }
    });
  }

  const litery = ['A', 'B', 'C', 'D'];
  const answersDiv = document.getElementById('qAnswers');
  answersDiv.innerHTML = '';
  q.odpowiedzi.forEach(function(ans, i) {
    const el = document.createElement('div');
    el.className = 'answer-chip' + (i === q.poprawna ? ' correct' : '');
    el.innerHTML = '<span class="letter">' + litery[i] + '.</span> ' + ans;
    answersDiv.appendChild(el);
  });

  const listDiv = document.getElementById('zawodnicyList');
  listDiv.innerHTML = '';
  zawodnicyList.forEach(function(name, i) {
    const score = (state.scores && state.scores[i]) || 0;
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML =
      '<div class="player-name">' + name + '</div>' +
      '<div class="player-score">' + score + ' pkt</div>' +
      '<div class="player-buttons">' +
        '<button onclick="addPoints(' + i + ',1)">+1</button>' +
        '<button onclick="addPoints(' + i + ',2)">+2</button>' +
        '<button onclick="addPoints(' + i + ',3)">+3</button>' +
        '<button onclick="addPoints(' + i + ',4)">+4</button>' +
      '</div>';
    listDiv.appendChild(row);
  });

  document.getElementById('showBtn').textContent = state.showQuestion ? 'Ukryj pytanie' : 'Pokaz pytanie graczowi';
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === total - 1;
}

function toggleShowQuestion() {
  db.ref('final/showQuestion').set(!state.showQuestion);
}

function revealMedia() {
  db.ref('final/mediaRevealed').set(true);
}

function nextQuestion() {
  if (state.currentIndex < finalQuestions.length - 1) {
    db.ref('final').update({ currentIndex: state.currentIndex + 1, showQuestion: false, mediaRevealed: false });
  }
}

function prevQuestion() {
  if (state.currentIndex > 0) {
    db.ref('final').update({ currentIndex: state.currentIndex - 1, showQuestion: false, mediaRevealed: false });
  }
}

function addPoints(i, pts) {
  const current = (state.scores && state.scores[i]) || 0;
  db.ref('final/scores/' + i).set(current + pts);
}

function endFinal() {
  if (!confirm('Na pewno zresetowac final (pytania od poczatku, punkty wyzerowane)?')) return;
  initFinal();
}
</script>
</body>
</html>
