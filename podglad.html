<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postaw na milion — Podgląd pytań</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0b1220;
    color: #f1f1f1;
    min-height: 100vh;
  }

  .qs-fullscreen {
    position: fixed;
    inset: 0;
    background: #0b1220;
    display: flex;
    flex-direction: column;
  }
  .qs-header {
    padding: 24px 30px;
    text-align: center;
    font-size: 2em;
    font-weight: bold;
    color: #d4af37;
    border-bottom: 2px solid #2a3550;
    line-height: 1.3;
  }
  .qs-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .qs-media {
    flex: 0 0 auto;
    max-width: 65%;
    border-right: 2px solid #2a3550;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    overflow: hidden;
  }
  .qs-media img, .qs-media video {
    height: 100%;
    width: auto;
    max-width: 100%;
    border-radius: 10px;
    object-fit: contain;
  }
  .qs-answers {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .qs-cell {
    border: 1px solid #2a3550;
    display: flex;
    align-items: flex-start;
    padding: 20px 24px;
    font-size: 1.4em;
    text-align: left;
    line-height: 1.25;
    overflow: hidden;
  }
  .qs-cell.correct { background: rgba(46,125,50,0.35); }
  .qs-cell .letter {
    font-weight: bold;
    color: #d4af37;
    margin-right: 16px;
    font-size: 1.1em;
    flex-shrink: 0;
  }

  .control-bar {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 9999;
    display: flex;
    gap: 8px;
  }
  .control-bar button, .fs-btn {
    background: #142238; border: 2px solid #d4af37; color: #f1f1f1;
    padding: 10px 14px; border-radius: 8px; font-size: 1em; cursor: pointer;
  }
  .control-bar button:hover { background: #1c3050; }
  .fs-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    font-size: 1.2em;
  }

  .jump-panel {
    position: fixed;
    top: 60px;
    left: 12px;
    z-index: 9999;
    background: #142238;
    border: 2px solid #d4af37;
    border-radius: 10px;
    padding: 14px;
    width: 320px;
    max-width: calc(100vw - 24px);
    display: none;
  }
  .jump-panel.open { display: block; }
  .jump-panel select {
    width: 100%;
    background: #1c3050; border: 2px solid #d4af37; color: #f1f1f1;
    padding: 10px; font-size: 0.95em; border-radius: 8px;
  }
  .jump-panel .position-label {
    color: #d4af37; font-size: 0.85em; margin-top: 8px; text-align: center;
  }

  @media (orientation: portrait) {
    .qs-header { font-size: 1.4em; padding: 16px; }
    .qs-body { flex-direction: column; }
    .qs-media { flex: 0 0 auto; max-width: 100% !important; width: 100% !important; height: 35%; border-right: none; border-bottom: 2px solid #2a3550; }
    .qs-media img, .qs-media video { height: 100%; width: auto; max-width: 100%; }
    .qs-cell { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="control-bar">
  <button onclick="prevQuestion()">◀ Poprzednie</button>
  <button onclick="nextQuestion()">Następne ▶</button>
  <button onclick="toggleJumpPanel()">☰ Wybierz pytanie</button>
</div>
<button class="fs-btn" onclick="toggleFullscreen()">⛶</button>

<div class="jump-panel" id="jumpPanel">
  <select id="jumpSelect" onchange="jumpTo(this.value)"></select>
  <div class="position-label" id="positionLabel"></div>
</div>

<div id="content"></div>

<script src="dane.js?v=3"></script>
<script>
const MEDIA_CANDIDATES = [
  { ext: 'jpg', type: 'image' },
  { ext: 'jpeg', type: 'image' },
  { ext: 'png', type: 'image' },
  { ext: 'webp', type: 'image' },
  { ext: 'gif', type: 'image' },
  { ext: 'mp4', type: 'video' },
  { ext: 'webm', type: 'video' }
];
const mediaCache = {};

function resolveMedia(baseName) {
  if (mediaCache[baseName]) return Promise.resolve(mediaCache[baseName]);
  let i = 0;
  function tryNext() {
    if (i >= MEDIA_CANDIDATES.length) return Promise.resolve(null);
    const c = MEDIA_CANDIDATES[i];
    i++;
    const url = 'media/' + baseName + '.' + c.ext;
    return fetch(url, { method: 'HEAD' }).then(res => {
      if (res.ok) {
        const result = { url: url, type: c.type };
        mediaCache[baseName] = result;
        return result;
      }
      return tryNext();
    }).catch(function() { return tryNext(); });
  }
  return tryNext();
}

const difficultyNames = { latwe: 'Łatwe', srednie: 'Średnie', trudne: 'Trudne', bardzo_trudne: 'Bardzo trudne' };
const setNames = { zestaw1: 'Zestaw 1', zestaw2: 'Zestaw 2', zestaw3: 'Zestaw 3' };

const allQuestions = [];
Object.keys(gameData).forEach(function(zestaw) {
  ['latwe', 'srednie', 'trudne', 'bardzo_trudne'].forEach(function(difficulty) {
    (gameData[zestaw][difficulty] || []).forEach(function(q, idx) {
      allQuestions.push({ zestaw: zestaw, difficulty: difficulty, indexInGroup: idx, q: q });
    });
  });
});

let currentIndex = 0;

const jumpSelect = document.getElementById('jumpSelect');
allQuestions.forEach(function(item, i) {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = (i + 1) + '. [' + setNames[item.zestaw] + ' / ' + difficultyNames[item.difficulty] + '] ' + item.q.kategoria;
  jumpSelect.appendChild(opt);
});

function toggleJumpPanel() {
  document.getElementById('jumpPanel').classList.toggle('open');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function() {});
  } else {
    document.exitFullscreen();
  }
}

function prevQuestion() {
  if (currentIndex > 0) { currentIndex--; render(); }
}
function nextQuestion() {
  if (currentIndex < allQuestions.length - 1) { currentIndex++; render(); }
}
function jumpTo(i) {
  currentIndex = parseInt(i, 10);
  render();
  document.getElementById('jumpPanel').classList.remove('open');
}

function fitCellFont(cell) {
  let fontSize = 70;
  const minFontSize = 13;
  cell.style.fontSize = fontSize + 'px';
  while (fontSize > minFontSize && (cell.scrollHeight > cell.clientHeight + 1 || cell.scrollWidth > cell.clientWidth + 1)) {
    fontSize--;
    cell.style.fontSize = fontSize + 'px';
  }
}

function fitAllCells() {
  document.querySelectorAll('.qs-cell').forEach(fitCellFont);
}

function render() {
  const item = allQuestions[currentIndex];
  const q = item.q;
  const litery = ['A', 'B', 'C', 'D'];

  document.getElementById('positionLabel').textContent =
    (currentIndex + 1) + ' / ' + allQuestions.length + ' — ' + setNames[item.zestaw] + ' / ' + difficultyNames[item.difficulty];
  jumpSelect.value = currentIndex;

  const mediaToShow = q.media;

  let answersHtml = '';
  q.odpowiedzi.forEach(function(a, i) {
    const isCorrect = i === q.poprawna;
    answersHtml += '<div class="qs-cell' + (isCorrect ? ' correct' : '') + '"><span class="letter">' + litery[i] + '.</span> ' + a + '</div>';
  });

  let mediaSlotHtml = '';
  if (mediaToShow) {
    mediaSlotHtml = '<div class="qs-media" id="qsMediaSlot"></div>';
  }

  const content = document.getElementById('content');
  content.innerHTML = '<div class="qs-fullscreen"><div class="qs-header">' + q.pytanie + '</div><div class="qs-body">' + mediaSlotHtml + '<div class="qs-answers">' + answersHtml + '</div></div></div>';

  requestAnimationFrame(fitAllCells);

  if (mediaToShow) {
    const slot = document.getElementById('qsMediaSlot');
    resolveMedia(mediaToShow).then(function(result) {
      if (!result || !slot.isConnected) return;
      if (result.type === 'video') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        video.addEventListener('loadedmetadata', fitAllCells);
        video.src = result.url;
        slot.innerHTML = '';
        slot.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.addEventListener('load', fitAllCells);
        img.src = result.url;
        slot.innerHTML = '';
        slot.appendChild(img);
      }
    }).catch(function() {
      slot.innerHTML = '<div style="color:#e57373; padding:20px;">Brak pliku: ' + mediaToShow + '</div>';
    });
  }
}

render();
</script>
</body>
</html>
